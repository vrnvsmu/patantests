<style>

20px}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--accent-dark)}.cards,.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:28px 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.panel{background:rgba(255,255,255,.68);border:1px solid #ffffffd9;border-radius:24px;padding:24px;box-shadow:var(--shadow),inset 0 1px #fff;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .22s ease,box-shadow .22s ease}.card{min-height:235px;display:flex;flex-direction:column;position:relative;overflow:hidden}.mode-card{align-items:center;justify-content:center;gap:20px;text-align:center;min-height:260px;color:var(--ink);width:100%;background:rgba(255,255,255,.68);border:1px solid #ffffffd9}.mode-card .ico{width:92px;height:92px;font-size:48px;border-radius:28px}.mode-card h3{font-size:clamp(25px,3vw,34px);margin:0}.mode-card:hover{background:rgba(255,255,255,.92)}.card:hover{transform:translateY(-4px);box-shadow:0 24px 55px #7663bb22}.card p{color:var(--muted);font-size:15px;flex:1;margin-top:0}.ico{font-size:27px;background:linear-gradient(145deg,#fff,#e9e2ff);color:#6e59c1;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;box-shadow:0 7px 20px #8b77d526;border:1px solid #fff}button{cursor:pointer;border:1px solid transparent;border-radius:14px;background:linear-gradient(135deg,#9b8ae9,#806bd4);color:#fff;padding:12px 17px;font-weight:700;font-size:15px;box-shadow:0 6px 16px #806bd426;transition:transform .2s,box-shadow .2s}button:hover{transform:translateY(-1px);box-shadow:0 10px 24px #806bd43b}button:active{transform:scale(.985)}button:disabled{opacity:.55}button.secondary{background:#ffffffb8;color:var(--ink);border-color:#d9d0f7;box-shadow:none}button.ghost{background:transparent;border:0;color:var(--ink);box-shadow:none}.item{background:#ffffffb8;border:1px solid #fff;border-radius:18px;text-align:left;color:var(--ink);padding:20px;transition:all .2s}.item:hover{background:#fff;border-color:#cfc3f8;transform:translateY(-2px)}.item strong{display:block;color:var(--ink);font-size:17px}.item small,.muted{color:var(--muted)}.notice,.feedback{background:#f0ebffb8;border:1px solid #ddd2ff;border-radius:15px;padding:14px 16px;margin:14px 0}.err{background:#fff0f2;border:1px solid #f1c2cc;border-radius:14px;padding:12px;margin:12px 0}.answers{display:grid;gap:12px;margin:20px 0}.answer{background:#ffffffc9;color:var(--ink);border:1px solid #d9d2ef;text-align:left;font-weight:550;border-radius:17px;padding:18px 20px;min-height:62px;box-shadow:none}.answer:hover{background:#f2eeff;border-color:#aa9ae8}.answer.sel{border-color:var(--accent);background:#eee9ff}.answer.correct{background:#a8e8bb;border:2px solid #16803a;color:#124b27}.answer.wrong{background:#ffb3bd;border:2px solid #c62842;color:#7f1024}.answer.correct:before{content:'✓';font-weight:900;font-size:1.15em;margin-right:10px}.answer.wrong:before{content:'✕';font-weight:900;font-size:1.15em;margin-right:10px}.question-nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.question-nav button{min-width:42px;padding:9px 12px;background:#fff;color:var(--ink);border:1px solid #cfc5ed;box-shadow:none}.question-nav button.current{background:#806bd4;color:white;border-color:#806bd4}.question-nav button.done{background:#b8e8c5;border-color:#4da76a}.question-nav button.skipped{border-style:dashed}.quiz-visual.empty{display:none}.quiz-layout.no-image{grid-template-columns:minmax(0,1fr)}.quiz-layout.no-image .quiz-content h3{font-size:clamp(25px,3vw,38px)}.quiz-content .answer.correct:before,.quiz-content .answer.wrong:before{display:inline-block}.zoom-wrap{position:relative;width:100%;height:100%;display:grid;place-items:center}.zoom-btn{position:absolute;right:12px;top:12px;z-index:2;border-radius:50%;width:46px;height:46px;padding:0;font-size:22px;background:#28243bcc}.zoom-overlay{position:fixed;inset:0;background:#100d1ddd;z-index:1000;display:fle </style></head><body>
<header><div class="brand" onclick="home()">ТестПатан ВГМУ<small>Патологическая анатомия</small></div><nav id="nav"></nav></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
// Do not push browser history on every DOM update. Native Back/Forward stays predictable.
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(CFG.url,CFG.key);
const MODES={macro:['📷','Макро',''],micro:['🔬','Микро',''],theory:['📖','Теория',''],exam:['🎓','Экзамен','']};
const BLOCKS={general:'Общая патология',specific:'Частная патология'};
let me=null,isAdmin=false,topics=[],Q=null;
let routeReplay=false;
function markRoute(route,replace=false){if(routeReplay)return;const url='#/'+route.replace(/^\/+/, '');if(location.hash===url)return;(replace?history.replaceState:history.pushState).call(history,{route},'',url)}
window.addEventListener('popstate',()=>{routeReplay=true;const r=location.hash.replace(/^#\/?/,'');restoreRoute(r).finally(()=>{routeReplay=false})});
async function restoreRoute(r){if(!r||r==='home')return home(false);const a=r.split('/');if(a[0]==='login')return authPage();if(a[0]==='mode'&&a[1])return pick(a[1],false);if(a[0]==='topic'&&a[1]&&a[2])return pickTopic(a[1],a[2],false);if(a[0]==='profile'&&me)return profile(false);if(a[0]==='admin'&&isAdmin)return admin(false);if(a[0]==='stats'&&isAdmin)return adminStats(a[1]||'');if(a[0]==='edit'&&isAdmin)return editQ(a[1]||undefined,false);if(a[0]==='quiz'&&Q)return showQ();return home(false)}

const pub=p=>p?sb.storage.from('testpatan-media').getPublicUrl(p).data.publicUrl:'';
const av=(p,n,big)=>p?`<img class="av ${big?'big':''}" src="${esc(pub(p))}" alt="">`:`<span class="av ${big?'big':''}">${esc((n||'?')[0].toUpperCase())}</span>`;
const msg=e=>{const m=e?.message||String(e);return /rate|too many/i.test(m)?'Слишком много попыток, подождите немного.':m};
const fail=(el,e)=>{el.innerHTML=`<div class="err">${esc(msg(e))}</div>`};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await loadMe();
  const t=await sb.from('topics').select('*').order('sort_order'); topics=t.data||[];
  nav(); await restoreRoute(location.hash.replace(/^#\/?/,''));
}
async function loadMe(){
  const {data:{user}}=await sb.auth.getUser(); if(!user){me=null;return}
  const p=await sb.from('profiles').select('*').eq('id',user.id).single(); me=p.data;
  const a=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle(); isAdmin=!!a.data;
}
function nav(){
  $('#nav').innerHTML=(me?`<button class="ghost" onclick="profile()">Личный кабинет</button>`+(isAdmin?`<button class="ghost" onclick="admin()">Администратор</button>`:'')+`<button class="ghost" onclick="logout()">Выйти</button>`:`<button class="ghost" onclick="authPage()">Вход / Регистрация</button>`);
}
async function logout(){await sb.auth.signOut();me=null;isAdmin=false;nav();home()}

function home(mark=true){if(mark)markRoute('home');
  app.innerHTML=`<section class="home-hero"><div><div class="eyebrow">ПАТОЛОГИЧЕСКАЯ АНАТОМИЯ · ВГМУ</div><h1>Проверяй знания. Находи темы для повторения.</h1><p class="muted">Тренируйся в своём темпе и отслеживай прогресс.</p></div></section><div class="cards">`+
  Object.entries(MODES).map(([k,v])=>`<button class="card mode-card" onclick="pick('${k}')"><div class="ico">${v[0]}</div><h3>${v[1]}</h3></button>`).join('')+`</div><div class="foot">Личный учебный кабинет · результаты доступны только в вашем профиле. Для прохождения тестов нужен вход.</div>`;
}
function needLogin(){if(!me){authPage();return true}return false}
function pick(mode,mark=true){if(mark)markRoute('mode/'+mode);
  if(needLogin())return;
  if(mode==='exam')return start('exam',null);
  app.innerHTML=`<h2>${MODES[mode][1]}: выберите блок</h2><div class="grid">`+Object.entries(BLOCKS).map(([b,n])=>`<button class="item" onclick="pickTopic('${mode}','${b}')"><strong>${n}</strong><small>${topics.filter(t=>t.block===b).length} тем</small></button>`).join('')+`</div><button class="secondary" onclick="home()">Назад</button>`;
}
function pickTopic(mode,b,mark=true){if(mark)markRoute('topic/'+mode+'/'+b);
  app.innerHTML=`<h2>${MODES[mode][1]} · ${BLOCKS[b]}</h2><div class="grid">`+topics.filter(t=>t.block===b).sort((a,b)=>a.sort_order-b.sort_order||a.title.localeCompare(b.title,'ru')).map(t=>`<button class="item" onclick="start('${mode}',${t.id})"><strong>${esc(t.title)}</strong></button>`).join('')+`</div><button class="secondary" onclick="pick('${mode}')">Назад</button>`;
}
async function start(mode,topic){markRoute('quiz');
  app.innerHTML='<p>Загрузка…</p>';
  const {data,error}=await sb.rpc('start_attempt',{p_mode:mode,p_topic_id:topic,p_count:10});

}
function showQ(){
  const q=Q.qs[Q.i],pc=Math.round((Q.i+1)/Q.qs.length*100),hasImage=!!q.image_path;
  if(!Q.order)Q.order={};
  if(!Q.order[q.id])Q.order[q.id]=[...(q.options||[])].sort(()=>Math.random()-.5);
  if(!Q.answers)Q.answers={};
  const nav=Q.qs.map((x,i)=>`<button class="${i===Q.i?'current ':''}${Q.answers[x.id]?'done ':'skipped'}" onclick="goQ(${i})" aria-label="Вопрос ${i+1}">${i+1}</button>`).join('');
  const visual=hasImage?`<div class="zoom-wrap"><img class="photo" src="${esc(pub(q.image_path))}" alt="Препарат" onclick="zoomImage(this.src)"><button class="zoom-btn" onclick="zoomImage('${esc(pub(q.image_path))}')" title="Увеличить изображение" aria-label="Увеличить изображение">⌕</button></div>`:'';
  app.innerHTML=`<div class="panel"><div class="muted">${esc(MODES[Q.mode]?.[1]||Q.mode)} · Вопрос ${Q.i+1} из ${Q.qs.length}</div><div class="progress"><span style="width:${pc}%"></span></div><div class="question-nav" aria-label="Выбор номера задания">${nav}</div><div class="quiz-layout ${hasImage?'':'no-image'}"><div class="quiz-visual ${hasImage?'':'empty'}">${visual}</div><div class="quiz-content"><h3>${esc(q.prompt)}</h3><div class="answers" id="ans">`+Q.order[q.id].map(o=>`<button class="answer" data-id="${o.id}">${esc(o.text)}</button>`).join('')+`</div><div id="fb"></div><div class="row"><button class="secondary" onclick="skipQ()">${Q.i===Q.qs.length-1?'К результатам':'Пропустить'}</button><button onclick="nextQ()">${Q.i===Q.qs.length-1?'Завершить тест':'Следующий вопрос →'}</button></div></div></div></div>`;
  const prior=Q.answers[q.id];
  document.querySelectorAll('#ans button').forEach(b=>{b.onclick=()=>answer(b,q);if(prior){b.disabled=true;if(b.dataset.id===prior.chosen)b.classList.add(prior.correct?'correct':'wrong');if(prior.correctId&&b.dataset.id===prior.correctId)b.classList.add('correct')}});
  if(prior&&Q.mode!=='exam')$('#fb').innerHTML=prior.explanation?`<div class="feedback">${esc(prior.explanation)}</div>`:'';
}
function goQ(i){if(i<0||i>=Q.qs.length)return;Q.i=i;showQ()}
function skipQ(){if(Q.i<Q.qs.length-1){Q.i++;showQ()}else finish()}
function zoomImage(src){
  const el=document.createElement('div');el.className='zoom-overlay';
  el.innerHTML=`<div class="zoom-toolbar"><span>Колесо мыши — масштаб · Перетаскивание — перемещение · Esc — закрыть</span><button type="button" class="zoom-close" aria-label="Закрыть">×</button></div><img src="${esc(src)}" alt="Увеличенное изображение" draggable="false">`;
  const img=el.querySelector('img');let scale=1,tx=0,ty=0,drag=false,sx=0,sy=0,ox=0,oy=0;
  const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;img.style.cursor=scale>1?'grab':'zoom-in'};
  const close=()=>{el.remove();document.removeEventListener('keydown',keyClose)};
  const keyClose=e=>{if(e.key==='Escape')close()};
  el.querySelector('.zoom-close').onclick=close;el.addEventListener('click',e=>{if(e.target===el)close()});
  el.addEventListener('wheel',e=>{e.preventDefault();const rect=img.getBoundingClientRect(),cx=e.clientX-(rect.left+rect.width/2),cy=e.clientY-(rect.top+rect.height/2),old=scale;scale=Math.max(1,Math.min(8,scale*(e.deltaY<0?1.2:1/1.2)));const ratio=scale/old;tx=(tx-cx)*ratio+cx;ty=(ty-cy)*ratio+cy;if(scale===1){tx=0;ty=0}apply()},{passive:false});
  img.addEventListener('pointerdown',e=>{if(scale<=1)return;drag=true;img.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;img.style.cursor='grabbing'});img.addEventListener('pointermove',e=>{if(!drag)return;tx=ox+e.clientX-sx;ty=oy+e.clientY-sy;apply()});img.addEventListener('pointerup',()=>{drag=false;apply()});img.addEventListener('dblclick',e=>{e.preventDefault();scale=scale===1?2.5:1;tx=ty=0;apply()});
  document.addEventListener('keydown',keyClose);document.body.appendChild(el);apply();
}

async function answer(btn,q){
  const bs=[...document.querySelectorAll('#ans button')];bs.forEach(b=>b.disabled=true);
  const {data,error}=await sb.rpc('check_answer',{p_attempt:Q.id,p_question:q.id,p_option:btn.dataset.id});
  if(error){fail($('#fb'),error);bs.forEach(b=>b.disabled=false);return}
  const prior={chosen:btn.dataset.id,correct:Q.mode==='exam'?null:!!data.is_correct,correctId:Q.mode==='exam'?null:data.correct_option_id,explanation:Q.mode==='exam'?'':(data.explanation||'')};
  Q.answers=q.id?Q.answers||{}:{};Q.answers[q.id]=prior;
  if(Q.mode==='exam'){btn.classList.add('sel');$('#fb').innerHTML='<div class="feedback">Ответ сохранён.</div>';return}
  bs.forEach(b=>{if(b.dataset.id===data.correct_option_id)b.classList.add('correct')});
  if(!data.is_correct)btn.classList.add('wrong');
  $('#fb').innerHTML=(data.explanation?`<div class="feedback">${esc(data.explanation)}</div>`:'');
  document.querySelectorAll('.question-nav button')[Q.i]?.classList.add('done');
}

<label><input type="checkbox" id="is_exam" ${q.is_exam?'checked':''}> Включить в экзамен (только режим «Макро»)</label>
<label><input type="checkbox" id="pb" ${q.is_published?'checked':''}> Опубликовать</label>
<div class="row"><button onclick="saveQ('${id||''}')">Сохранить</button><button class="secondary" onclick="admin()">Отмена</button>${id?`<button class="danger" onclick="delQ('${id}')">Удалить</button>`:''}</div></div>`;
}
async function saveQ(id){
  try{
    const o=[...document.querySelectorAll('.op')].map(i=>i.value.trim()),k=document.querySelector('input[name=k]:checked');
    const sec=$('#s').value,pr=$('#pr').value.trim(),pubd=$('#pb').checked;
    if(!pr)throw new Error('Введите текст вопроса');
    if(o.filter(Boolean).length<2)throw new Error('Нужно минимум два варианта');
    if(!k||!o[+k.value])throw new Error('Отметьте правильный вариант (он должен быть непустым)');
    const row={section:sec,topic_id:+$('#t').value,prompt:pr,is_exam:sec==='macro'&&$('#is_exam').checked,is_published:false};
    const f=$('#img').files[0];let old=null;
    if(id)old=(await sb.from('questions').select('image_path').eq('id',id).single()).data?.image_path;
    if(f){row.image_path=`questions/${crypto.randomUUID()}.${EXT[f.type]||'x'}`;await upload(row.image_path,f)}
    else if($('#rmimg')?.checked)row.image_path=null;
    if(id){const r=await sb.from('questions').update(row).eq('id',id);if(r.error)throw r.error}
    else{const r=await sb.from('questions').insert(row).select('id').single();if(r.error)throw r.error;id=r.data.id}
    if((f||$('#rmimg')?.checked)&&old)await sb.storage.from('testpatan-media').remove([old]);
    await sb.from('question_options').delete().eq('question_id',id); // ответ-ключ удалится каскадом и создастся заново
    const ins=await sb.from('question_options').insert(o.map((t,i)=>t?{question_id:id,option_text:t,sort_order:i,_i:i}:null).filter(Boolean).map(({_i,...r})=>r)).select('id,sort_order');
    if(ins.error)throw ins.error;
    const cid=ins.data.find(x=>x.sort_order===+k.value).id;
    const a=await sb.from('question_answers').upsert({question_id:id,correct_option_id:cid,explanation:$('#ex').value.trim()||null});if(a.error)throw a.error;
    if(pubd){const u=await sb.from('questions').update({is_published:true}).eq('id',id);if(u.error)throw u.error}
    admin();
  }catch(e){fail($('#e'),e)}
}
async function delQ(id){
  if(!confirm('Удалить вопрос безвозвратно?'))return;
  const {error}=await sb.from('questions').delete().eq('id',id);
  error?fail($('#e'),error):admin();
}
init();
</script></body></html>
