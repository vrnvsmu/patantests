window.addEventListener('popstate',()=>{routeReplay=true;const r=location.hash.replace(/^#\/?/,'');restoreRoute(r).finally(()=>{routeReplay=false})});
async function restoreRoute(r){if(!r||r==='home')return home(false);const a=r.split('/');if(a[0]==='login')return authPage();if(a[0]==='mode'&&a[1])return pick(a[1],false);if(a[0]==='topic'&&a[1]&&a[2])return pickTopic(a[1],a[2],false);if(a[0]==='profile'&&me)return profile(false);if(a[0]==='favorites')return favoritesPage(false);if(a[0]==='favorite'&&a[1])return openFavorite(a[1],false);if(a[0]==='tests')return testsPage(false);if(a[0]==='materials')return materialsPage(false);if(a[0]==='admincontent'&&isAdmin)return adminContent(false);if(a[0]==='adminmaterials'&&isAdmin)return adminMaterials(false);if(a[0]==='adminnotify'&&isAdmin)return adminNotifications(false);if(a[0]==='admin'&&isAdmin)return admin(false);if(a[0]==='admintrash'&&isAdmin)return adminTrash(false);if(a[0]==='stats'&&isAdmin)return adminStats(a[1]||'');if(a[0]==='edit'&&isAdmin)return editQ(a[1]||undefined,false);if(a[0]==='quiz'&&Q)return showQ();return home(false)}

const pub=p=>p?sb.storage.from('testpatan-media').getPublicUrl(p).data.publicUrl:'';
const av=(p,n,big)=>p?`<img class="av ${big?'big':''}" src="${esc(pub(p))}" alt="">`:`<span class="av ${big?'big':''}">${esc((n||'?')[0].toUpperCase())}</span>`;
const msg=e=>{const m=e?.message||String(e);return /rate|too many/i.test(m)?'Слишком много попыток, подождите немного.':m};
const fail=(el,e)=>{el.innerHTML=`<div class="err">${esc(msg(e))}</div>`};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await loadMe();
  const t=await sb.from('topics').select('*').order('sort_order'); topics=t.data||[];
  nav(); await restoreRoute(location.hash.replace(/^#\/?/,''));
}
async function loadMe(){
  const {data:{user}}=await sb.auth.getUser(); if(!user){me=null;return}
  const p=await sb.from('profiles').select('*').eq('id',user.id).single(); me=p.data;
  const a=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle(); isAdmin=!!a.data;
}
function nav(){
  $('#nav').innerHTML=(me?`<button class="ghost" onclick="profile()">Личный кабинет</button>`+(isAdmin?`<button class="ghost" onclick="admin()">Администратор</button>`:'')+`<button class="ghost" onclick="logout()">Выйти</button>`:`<button class="ghost" onclick="authPage()">Вход / Регистрация</button>`);
}
async function logout(){await sb.auth.signOut();me=null;isAdmin=false;nav();home()}

function toast(s){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function sectionsPage(mark=true){if(mark)markRoute('sections');const items=[['macro','Макро','Макроскопическое строение органов и тканей.','asset-liver.png','mode-macro'],['micro','Микро','Микроскопические изменения и морфология.','asset-microscope.png','mode-micro'],['theory','Теория','Основные понятия, классификации, схемы.','asset-book.png','mode-theory'],['exam','Экзамен','Итоговые тесты и контроль знаний.','asset-cap.png','mode-exam']];app.innerHTML=`<div class="eyebrow">ПОДГОТОВКА К ЗАНЯТИЯМ</div><h2>Все разделы</h2><p class="muted">Выберите формат работы.</p><div class="dashboard-modes">${items.map(x=>`<button class="dash-mode ${x[4]}" onclick="pick('${x[0]}')"><div class="mode-art"><img src="assets/${x[3]}" alt="" onerror="this.style.display='none'"></div><div class="mode-meta"><strong>${x[1]}</strong><small>${x[2]}</small></div><span class="mode-arrow">→</span></button>`).join('')}</div>`;}
function testsPage(mark=true){if(mark)markRoute('tests');document.querySelectorAll('.side-link').forEach(x=>x.classList.toggle('active',x.dataset.side==='tests'));const items=[['macro','Макро','Макроскопическое строение органов и тканей.','asset-liver.png','mode-macro'],['micro','Микро','Микроскопические изменения и морфология.','asset-microscope.png','mode-micro'],['theory','Теория','Основные понятия, классификации, схемы.','asset-book.png','mode-theory'],['exam','Экзамен','Итоговые тесты и контроль знаний.','asset-cap.png','mode-exam']];app.innerHTML=`<div class="eyebrow">ПРОВЕРКА ЗНАНИЙ</div><h2>Тесты</h2><p class="muted">Выберите режим тестирования.</p><div class="dashboard-modes">${items.map(x=>`<button class="dash-mode ${x[4]}" onclick="pick('${x[0]}')"><div class="mode-art"><img src="assets/${x[3]}" alt=""></div><div class="mode-meta"><strong>${x[1]}</strong><small>${x[2]}</small></div><span class="mode-arrow">→</span></button>`).join('')}</div>`;}
async function openFavorite(id,mark=true){if(mark)markRoute('favorite/'+id);const {data,error}=await sb.from('questions').select('id,prompt,section,image_path,topic_id').eq('id',id).maybeSingle();if(error||!data){toast(error?msg(error):'Вопрос больше недоступен');return favoritesPage(false)}const q=data,topic=topics.find(t=>String(t.id)===String(q.topic_id));document.querySelectorAll('.side-link').forEach(x=>x.classList.toggle('active',x.textContent.includes('Избранное')));app.innerHTML=`<div class="eyebrow">ИЗБРАННЫЙ ВОПРОС</div><h2>${esc(MODES[q.section]?.[1]||q.section)}${topic?' · '+esc(topic.title):''}</h2><article class="material-card favorite-detail">${q.image_path?`<img class="favorite-detail-image" src="${esc(pub(q.image_path))}" alt="Изображение вопроса" onclick="zoomImage(this.src)">`:''}<h3>${esc(q.prompt)}</h3><p class="muted">Вопрос сохранён в избранном. Чтобы ответить на него в режиме проверки знаний, откройте соответствующий раздел.</p><div class="row"><button onclick="pick('${esc(q.section)}')">Перейти к режиму ${esc(MODES[q.section]?.[1]||q.section)}</button><button class="secondary" onclick="favoritesPage()">Назад к избранному</button><button class="favorite-btn" onclick="removeFavorite('${q.id}')">★ Удалить из избранного</button></div></article>`;}
async function loadHomeFavorites(){const box=$('#home-favorites-list');if(!box)return;if(!me){box.innerHTML='<div class="favorite-empty compact-empty">Войдите, чтобы просматривать сохранённые вопросы.</div>';return}try{const {data,error}=await sb.from('question_favorites').select('question_id,questions(id,prompt,section,image_path,topic_id)').eq('user_id',me.id).order('created_at',{ascending:false}).limit(4);if(error)throw error;const rows=(data||[]).filter(x=>x.questions);if(!rows.length){box.innerHTML='<div class="favorite-empty compact-empty">Пока нет избранных вопросов. Добавляйте их во время прохождения тестов.</div>';return}box.innerHTML=rows.map(x=>{const q=x.questions;return `<button class="home-favorite-card" onclick="openFavorite('${q.id}')">${q.image_path?`<img src="${esc(pub(q.image_path))}" alt="">`:'<span class="home-fav-placeholder">✧</span>'}<b>${esc(q.prompt)}</b><small>${esc(MODES[q.section]?.[1]||q.section)}</small><span class="home-fav-arrow">→</span></button>`}).join('')}catch(e){box.innerHTML='<div class="favorite-empty compact-empty">Избранное пока недоступно.</div>';console.warn('home favorites',e)}}
async function loadLatestResults(){const box=$('#home-latest-results');if(!box)return;if(!me){box.innerHTML='<div class="favorite-empty compact-empty">Войдите, чтобы видеть свои последние результаты.</div>';return}try{const {data,error}=await sb.from('attempts').select('id,mode,topic_id,question_count,correct_count,percent,created_at').eq('user_id',me.id).eq('status','finished').order('created_at',{ascending:false}).limit(4);if(error)throw error;if(!data?.length){box.innerHTML='<div class="favorite-empty compact-empty">Пока нет завершённых попыток. Результаты появятся здесь после первого теста.</div>';return}box.innerHTML=data.map(a=>{const topic=topics.find(t=>String(t.id)===String(a.topic_id)),pct=Number(a.percent||0),mode=MODES[a.mode]?.[1]||a.mode,date=new Date(a.created_at).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});return `<div class="result-row"><span class="result-icon">${a.mode==='macro'?'▧':a.mode==='micro'?'▦':a.mode==='theory'?'▤':'▣'}</span><div class="result-main"><b>${esc(mode)}${topic?' · '+esc(topic.title):' · Смешанные темы'}</b><div class="result-bar"><span style="width:${Math.max(0,Math.min(100,pct))}%"></span></div><small>${Number(a.correct_count||0)} из ${Number(a.question_count||0)} ответов (${Math.round(pct)}%)</small></div><span class="result-percent">${Math.round(pct)}%</span><time>${date}</time></div>`}).join('')}catch(e){box.innerHTML='<div class="favorite-empty compact-empty">История результатов пока недоступна.</div>';console.warn('latest results',e)}}
const normQ=v=>String(v||'').toLowerCase().replace(/ё/g,'е').trim();
const SEARCH_SECTIONS=[['Макро','Макроскопическое строение органов и тканей',()=>pick('macro')],['Микро','Микроскопические изменения и морфология',()=>pick('micro')],['Теория','Основные понятия, классификации, схемы',()=>pick('theory')],['Экзамен','Итоговые тесты и контроль знаний',()=>pick('exam')],['Избранное','Избранные вопросы и тест по ним',()=>favoritesPage()],['Материалы','Учебные материалы и файлы',()=>materialsPage()],['Статистика','Личный кабинет и результаты',()=>profile()]];
function searchLocal(q){const n=normQ(q);if(!n)return{sections:[],topics:[]};return{sections:SEARCH_SECTIONS.map((x,i)=>[x,i]).filter(([x])=>normQ(x[0]+' '+x[1]).includes(n)),topics:topics.filter(t=>normQ(t.title).includes(n))}}
let searchTimer=null;
function searchSuggest(v){clearTimeout(searchTimer);const box=$('#searchDrop');if(!box)return;const q=v.trim();if(!q){box.hidden=true;return}
  searchTimer=setTimeout(()=>{const r=searchLocal(q),items=[];r.sections.slice(0,4).forEach(([x,i])=>items.push(`<button type="button" onclick="searchGoSection(${i})"><b>${esc(x[0])}</b><small>раздел</small></button>`));r.topics.slice(0,6).forEach(t=>items.push(`<button type="button" onclick="searchTopic(${t.id})"><b>${esc(t.title)}</b><small>тема</small></button>`));
  items.push(`<button type="button" class="all" onclick="searchSite(document.getElementById('siteSearch').value)">Искать «${esc(q)}» везде, включая материалы →</button>`);box.innerHTML=items.join('');box.hidden=false},150)}
function searchClose(){const b=$('#searchDrop');if(b)b.hidden=true}
function searchGoSection(i){searchClose();SEARCH_SECTIONS[i][2]()}
function isTopicLocked(t,mode){const key={macro:'is_locked_macro',micro:'is_locked_micro',theory:'is_locked_theory'}[mode];return key&&typeof t?.[key]==='boolean'?t[key]:!!t?.is_locked}
function topicLockIcon(t,mode){return isTopicLocked(t,mode)?'🔒':'🔓'}
function topicLockControl(t,mode){const locked=isTopicLocked(t,mode);return isAdmin?`<button type="button" class="secondary topic-lock-toggle" title="${locked?'Открыть тему':'Закрыть тему'} в режиме ${MODES[mode][1]}" onclick="event.stopPropagation();toggleTopicLock('${t.id}','${mode}',${locked})">${topicLockIcon(t,mode)} ${locked?'Закрыта':'Открыта'}</button>`:(locked?'<span class="topic-locked-icon" title="Тема временно закрыта в этом режиме" aria-label="Тема временно закрыта">🔒</span>':'')}
async function toggleTopicLock(id,mode,currentlyLocked){if(!isAdmin)return;const key={macro:'is_locked_macro',micro:'is_locked_micro',theory:'is_locked_theory'}[mode];if(!key)return;const next=!currentlyLocked;const {data,error}=await sb.from('topics').update({[key]:next}).eq('id',id).select(`id,${key}`).maybeSingle();if(error){toast('Не удалось изменить доступ к теме. Сначала выполните SQL-миграцию в Supabase: '+msg(error));return}const t=topics.find(x=>String(x.id)===String(id));if(t)t[key]=next;toast(next?`Тема закрыта в режиме ${MODES[mode][1]}`:`Тема открыта в режиме ${MODES[mode][1]}`);const hash=location.hash.replace(/^#\/?/,'');if(hash.startsWith('topic/')){const parts=hash.split('/');pickTopic(parts[1],parts[2],false)}else if(hash.startsWith('mode/'))pick(hash.split('/')[1],false);else home(false)}
function searchTopic(id){searchClose();const t=topics.find(x=>String(x.id)===String(id));if(!t)return;app.innerHTML=`<div class="eyebrow">${esc(BLOCKS[t.block]||'Тема')}</div><h2>${esc(t.title)}</h2><p class="muted">Выберите режим теста по этой теме.</p><div class="row" style="flex-wrap:wrap">${['macro','micro','theory'].map(m=>`<button ${isTopicLocked(t,m)&&!isAdmin?'disabled title="Тема закрыта в этом режиме"':''} onclick="start('${m}',${t.id})">${isTopicLocked(t,m)?'🔒 ':''}${MODES[m][0]} ${MODES[m][1]}</button>`).join('')}<button class="secondary" onclick="home()">На главную</button></div>`}
async function searchSite(v){const q=String(v||'').trim();searchClose();if(!q)return;markRoute('search');const inp=$('#siteSearch');if(inp)inp.value=q;
  const r=searchLocal(q);app.innerHTML=`<h2>Поиск: «${esc(q)}»</h2><p class="muted">Ищем по разделам, темам и материалам…</p>`;
  let mats=[],matErr=false;try{const safe=q.replace(/[%,()*\\]/g,' ').trim();const res=await sb.from('learning_materials').select('*').eq('is_published',true).or(`title.ilike.%${safe}%,body.ilike.%${safe}%,kind.ilike.%${safe}%,file_name.ilike.%${safe}%`).order('sort_order').limit(30);if(res.error)throw res.error;mats=res.data||[]}catch(e){matErr=true}
  const total=r.sections.length+r.topics.length+mats.length;
  app.innerHTML=`<h2>Поиск: «${esc(q)}»</h2>`+(total?'':`<div class="favorite-empty"><h3>Ничего не найдено</h3><p>Попробуйте другое слово или часть названия темы.</p></div>`)
   +(r.sections.length?`<h3>Разделы</h3><div class="grid">${r.sections.map(([x,i])=>`<button class="item" onclick="searchGoSection(${i})"><strong>${esc(x[0])}</strong><small>${esc(x[1])}</small></button>`).join('')}</div>`:'')
   +(r.topics.length?`<h3>Темы</h3><div class="grid">${r.topics.map(t=>`<button class="item" onclick="searchTopic(${t.id})"><strong>${esc(t.title)}</strong><small>${esc(BLOCKS[t.block]||'')}</small></button>`).join('')}</div>`:'')
   +(mats.length?`<h3>Материалы</h3>${mats.map(matCard).join('')}`:'')
   +(matErr?'<p class="muted">Материалы сейчас недоступны для поиска.</p>':'')}

function needLogin(){if(!me){authPage();return true}return false}
function pick(mode,mark=true){if(mark)markRoute('mode/'+mode);
  if(mode==='exam')return start('exam',null);
  app.innerHTML=`<h2>${MODES[mode][1]}: выберите блок</h2><div class="grid">`+Object.entries(BLOCKS).map(([b,n])=>`<button class="item" onclick="pickTopic('${mode}','${b}')"><strong>${n}</strong><small>${topics.filter(t=>t.block===b).length} тем</small></button>`).join('')+`</div><button class="secondary" onclick="home()">Назад</button>`;
}
function pickTopic(mode,b,mark=true){if(mark)markRoute('topic/'+mode+'/'+b);
  app.innerHTML=`<h2>${MODES[mode][1]} · ${BLOCKS[b]}</h2><div class="grid">`+topics.filter(t=>t.block===b).sort((a,b)=>a.sort_order-b.sort_order||a.title.localeCompare(b.title,'ru')).map(t=>{const locked=isTopicLocked(t,mode);return `<div class="item topic-item ${locked&&!isAdmin?'topic-item-locked':''}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left"><button type="button" class="topic-open-button" style="flex:1;text-align:left;background:transparent;color:inherit;border:0;padding:8px 0;box-shadow:none" onclick="openTopicFromList('${mode}',${t.id})"><strong>${esc(t.title)}</strong></button>${topicLockControl(t,mode)}</div>`}).join('')+`</div><button class="secondary" onclick="pick('${mode}')">Назад</button>`;
}
function openTopicFromList(mode,id){const t=topics.find(x=>String(x.id)===String(id));if(!t)return;if(isTopicLocked(t,mode)&&!isAdmin){toast('Эта тема временно закрыта в режиме '+MODES[mode][1]+'.');return}start(mode,id)}
async function start(mode,topic){if(topic!=null){const locked=topics.find(t=>String(t.id)===String(topic));if(locked&&isTopicLocked(locked,mode)&&!isAdmin){toast('Эта тема временно закрыта в режиме '+(MODES[mode]?.[1]||mode)+'.');return}}markRoute('quiz');
  app.innerHTML='<p>Загрузка…</p>';
  const {data,error}=await sb.rpc('start_attempt',{p_mode:mode,p_topic_id:topic,p_count:100});
  if(error){fail(app,error);app.innerHTML+='<button class="secondary" onclick="home()">На главную</button>';return}
  Q={id:data.attempt_id,qs:data.questions,i:0,mode,t0:Date.now()}; showQ();
}
async function startFavorites(){markRoute('quiz');
  app.innerHTML='<p>Загрузка…</p>';

function groupTasks(qs){const map=new Map(),tasks=[];qs.forEach(q=>{const key=q.image_path||('q:'+q.id);if(!map.has(key)){const t=[];map.set(key,t);tasks.push(t)}map.get(key).push(q)});tasks.forEach(t=>t.sort((x,y)=>String(x.created_at||'').localeCompare(String(y.created_at||''))));return tasks}
const taskDone=t=>t.every(q=>Q.answers?.[q.id]);
function showQ(){
  if(!Q.tasks)Q.tasks=groupTasks(Q.qs);
  const task=Q.tasks[Q.i],first=task[0],many=task.length>1,hasImage=!!first.image_path,pc=Math.round((Q.i+1)/Q.tasks.length*100);
  Q.order=Q.order||{};Q.answers=Q.answers||{};
  task.forEach(q=>{if(!Q.order[q.id])Q.order[q.id]=[...(q.options||[])].sort(()=>Math.random()-.5)});
  const nav=Q.tasks.map((t,i)=>`<button class="${i===Q.i?'current ':''}${taskDone(t)?'done ':'skipped'}" onclick="goQ(${i})" aria-label="Задание ${i+1}">${i+1}</button>`).join('');
  const visual=hasImage?`<div class="zoom-wrap"><img class="photo" src="${esc(pub(first.image_path))}" alt="Препарат" onclick="zoomImage(this.src)"><button class="zoom-btn" onclick="zoomImage('${esc(pub(first.image_path))}')" title="Увеличить изображение" aria-label="Увеличить изображение">⌕</button></div>`:'';
  const blocks=task.map((q,k)=>`<div class="q-sub ${many?'multi':''}"><div class="q-sub-head">${many?`<span class="q-sub-num">Вопрос ${k+1} из ${task.length}</span>`:'<span></span>'}<button class="favorite-btn ${Q.favorites?.[q.id]?'on':''}" onclick="toggleFavorite('${q.id}')">${Q.favorites?.[q.id]?'★ В избранном':'☆ В избранное'}</button></div><h3>${esc(q.prompt)}</h3><div class="answers" data-q="${q.id}">`+Q.order[q.id].map(o=>`<button class="answer" data-id="${o.id}">${esc(o.text)}</button>`).join('')+`</div><div class="fb" data-q="${q.id}"></div></div>`).join('');
  const last=Q.i===Q.tasks.length-1;
  app.innerHTML=`<div class="panel"><div class="q-head-tools"><div class="muted">${esc(MODES[Q.mode]?.[1]||Q.mode)} · Задание ${Q.i+1} из ${Q.tasks.length}${many?` · вопросов к фото: ${task.length}`:''}</div></div><div class="progress"><span style="width:${pc}%"></span></div><div class="question-nav" aria-label="Выбор номера задания">${nav}</div><div class="quiz-layout ${hasImage?'':'no-image'}"><div class="quiz-visual ${hasImage?'':'empty'}">${visual}</div><div class="quiz-content">${blocks}<div class="row"><button class="secondary" onclick="skipQ()">${last?'К результатам':'Пропустить'}</button><button onclick="nextQ()">${last?'Завершить тест':'Следующее задание →'}</button></div></div></div></div>`;
  task.forEach(q=>{const prior=Q.answers[q.id],fb=document.querySelector(`.fb[data-q="${q.id}"]`);
    document.querySelectorAll(`.answers[data-q="${q.id}"] button`).forEach(b=>{b.onclick=()=>answer(b,q);if(prior){b.disabled=true;if(b.dataset.id===prior.chosen)b.classList.add(Q.mode==='exam'?'sel':prior.correct?'correct':'wrong');if(prior.correctId&&b.dataset.id===prior.correctId)b.classList.add('correct')}});
    if(prior&&fb)fb.innerHTML=Q.mode==='exam'?'<div class="feedback">Ответ сохранён.</div>':(prior.explanation?`<div class="feedback">${esc(prior.explanation)}</div>`:'')});
}
function goQ(i){if(i<0||i>=Q.tasks.length)return;Q.i=i;showQ()}
function skipQ(){if(Q.i<Q.tasks.length-1){Q.i++;showQ()}else finish()}
function zoomImage(src){
  const el=document.createElement('div');el.className='zoom-overlay';
  el.innerHTML=`<div class="zoom-toolbar"><span>Колесо мыши — масштаб · Перетаскивание — перемещение · Esc — закрыть</span><button type="button" class="zoom-close" aria-label="Закрыть">×</button></div><img src="${esc(src)}" alt="Увеличенное изображение" draggable="false">`;
  const img=el.querySelector('img');let scale=1,tx=0,ty=0,drag=false,sx=0,sy=0,ox=0,oy=0;
  const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;img.style.cursor=scale>1?'grab':'zoom-in'};
  const close=()=>{el.remove();document.removeEventListener('keydown',keyClose)};
  const keyClose=e=>{if(e.key==='Escape')close()};
  el.querySelector('.zoom-close').onclick=close;el.addEventListener('click',e=>{if(e.target===el)close()});
  el.addEventListener('wheel',e=>{e.preventDefault();const rect=img.getBoundingClientRect(),cx=e.clientX-(rect.left+rect.width/2),cy=e.clientY-(rect.top+rect.height/2),old=scale;scale=Math.max(1,Math.min(8,scale*(e.deltaY<0?1.2:1/1.2)));const ratio=scale/old;tx=(tx-cx)*ratio+cx;ty=(ty-cy)*ratio+cy;if(scale===1){tx=0;ty=0}apply()},{passive:false});
  img.addEventListener('pointerdown',e=>{if(scale<=1)return;drag=true;img.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;img.style.cursor='grabbing'});img.addEventListener('pointermove',e=>{if(!drag)return;tx=ox+e.clientX-sx;ty=oy+e.clientY-sy;apply()});img.addEventListener('pointerup',()=>{drag=false;apply()});img.addEventListener('dblclick',e=>{e.preventDefault();scale=scale===1?2.5:1;tx=ty=0;apply()});
  document.addEventListener('keydown',keyClose);document.body.appendChild(el);apply();
}

async function answer(btn,q){
  const box=btn.closest('.answers'),fb=document.querySelector(`.fb[data-q="${q.id}"]`),bs=[...box.querySelectorAll('button')];bs.forEach(b=>b.disabled=true);
  const {data,error}=await sb.rpc('check_answer',{p_attempt:Q.id,p_question:q.id,p_option:btn.dataset.id});
  if(error){fail(fb,error);bs.forEach(b=>b.disabled=false);return}
  const prior={chosen:btn.dataset.id,correct:Q.mode==='exam'?null:!!data.is_correct,correctId:Q.mode==='exam'?null:data.correct_option_id,explanation:Q.mode==='exam'?'':(data.explanation||'')};
  Q.answers=Q.answers||{};Q.answers[q.id]=prior;
  const nb=document.querySelectorAll('.question-nav button')[Q.i];if(nb&&taskDone(Q.tasks[Q.i])){nb.classList.add('done');nb.classList.remove('skipped')}
  if(Q.mode==='exam'){btn.classList.add('sel');fb.innerHTML='<div class="feedback">Ответ сохранён.</div>';return}
  bs.forEach(b=>{if(b.dataset.id===data.correct_option_id)b.classList.add('correct')});
  if(!data.is_correct)btn.classList.add('wrong');
  fb.innerHTML=(data.explanation?`<div class="feedback">${esc(data.explanation)}</div>`:'');
}

function nextQ(){Q.i++;Q.i<Q.tasks.length?showQ():finish()}
async function finish(){

function selectAdminQuestion(id,checked){if(checked)selectedAdminQuestions.add(String(id));else selectedAdminQuestions.delete(String(id));const n=$('#selectedAdminCount');if(n)n.textContent=selectedAdminQuestions.size;const boxes=[...document.querySelectorAll('.admin-question-select')];const all=$('#selectAllAdminQuestions');if(all)all.checked=boxes.length>0&&boxes.every(b=>b.checked);}
function toggleSelectAllAdminQuestions(checked){document.querySelectorAll('.admin-question-select').forEach(b=>{b.checked=checked;if(checked)selectedAdminQuestions.add(String(b.value));else selectedAdminQuestions.delete(String(b.value))});const n=$('#selectedAdminCount');if(n)n.textContent=selectedAdminQuestions.size;}
async function deleteSelectedAdminQuestions(){
  if(!isAdmin)return home();
  const ids=[...selectedAdminQuestions];
  if(!ids.length){toast('Сначала выберите вопросы для удаления');return}
  if(!confirm(`Переместить в корзину вопросы (${ids.length})? Их можно будет восстановить.`))return;
  const btns=[...document.querySelectorAll('button[onclick="deleteSelectedAdminQuestions()"]')];btns.forEach(b=>{b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='Удаление…'});
  let succeeded=0;const failures=[];
  // Убираем выбор сразу и обрабатываем каждый ID независимо: одна ошибка не прерывает всю пачку.
  selectedAdminQuestions.clear();
  for(const id of ids){
    try{
      await moveQuestionToTrash(id);succeeded++;
      const box=[...document.querySelectorAll('.admin-question-select')].find(b=>String(b.value)===String(id));
      if(box)box.closest('tr')?.remove();
    }catch(e){failures.push({id,message:e?.message||String(e)});}
    const counter=$('#selectedAdminCount');if(counter)counter.textContent='0';
  }
  try{await admin(false)}catch(e){console.error('Не удалось обновить список вопросов',e)}
  if(failures.length===0)toast(`В корзину перемещено вопросов: ${succeeded} из ${ids.length}`);
  else{
    const details=failures.slice(0,3).map(x=>`${x.id}: ${x.message}`).join(' | ');
    toast(`Перемещено ${succeeded} из ${ids.length}. Не удалось: ${failures.length}. ${details}`);
    console.error('Ошибки массового удаления вопросов:',failures);
  }
}

async function toggleQuestionPublish(id,isPublished){

  const next=!isPublished;
  try{
    const {error}=await sb.from('questions').update({is_published:next}).eq('id',id);
    if(error)throw error;
    toast(next?'Вопрос опубликован':'Вопрос переведён в черновики');
    await admin(false);
  }catch(e){toast('Не удалось изменить статус: '+(e?.message||e));}
}

function normalizeImportText(s){return String(s||'').replace(/\u00a0/g,' ').replace(/[\t ]+/g,' ').trim()}
function cleanOption(s){return normalizeImportText(s).replace(/^(?:[A-DА-Гa-dа-г]|\d{1,2})[).:]\s*/,'').replace(/^[•–—-]\s*/,'').trim()}
function parseDocxParagraphs(xml){

function parseQuestionLines(lines){

function normAnswer(s){return normalizeImportText(s).toLocaleLowerCase('ru').replace(/[“”„«»"']/g,'').replace(/[.,;:!?]+$/,'').replace(/\s+/g,' ')}

function readDocxPreview(){for(const el of document.querySelectorAll('[data-di]')){const i=+el.dataset.i,q=docxImportRows[i];if(el.dataset.di==='prompt')q.prompt=el.value.trim();else if(el.dataset.di==='correct')q.correct=el.value.trim();else if(el.dataset.di==='explanation')q.explanation=el.value.trim();else if(el.dataset.di==='option')q.options[+el.dataset.j]=el.value.trim()}for(const q of docxImportRows){q.correctIndex=q.options.findIndex(x=>normAnswer(x)===normAnswer(q.correct));q.errors=[];if(!q.prompt)q.errors.push('Нет текста вопроса');if(q.options.filter(Boolean).length<2)q.errors.push('Нужно минимум 2 варианта');if(!q.correct)q.errors.push('Не указан правильный ответ');if(q.correctIndex<0)q.errors.push('Правильный ответ не совпал ни с одним вариантом')}}

async function checkDocxDuplicates(){

      const key=normalizeQuestionForDuplicate(row.prompt);if(!key)continue;

        q.isDuplicate=true;q.duplicateReason='Повторяется в самом документе';insideCount++;

      const q=docxImportRows[i];if(!q)return;

    });

  }catch(e){if(result)result.innerHTML=`<div class="err">Не удалось проверить дубликаты во всех темах: ${esc(e.message||e)}. Импорт остановлен, чтобы не добавить повторы.</div>`;return false}
}

async function saveQ(id){
  try{
    const sec=$('#s').value,pubd=$('#pb').checked,many=document.querySelectorAll('#qblocks .qblock').length>1;
    const blocks=[...document.querySelectorAll('#qblocks .qblock')].map((bl,i)=>{const lab=many?`Вопрос ${i+1}: `:'',o=[...bl.querySelectorAll('.op')].map(x=>x.value.trim()),k=bl.querySelector('input[type=radio]:checked'),pr=bl.querySelector('.pr').value.trim(),ex=bl.querySelector('.ex').value.trim();
      if(!pr)throw new Error(lab+'введите текст вопроса');
      if(o.filter(Boolean).length<2)throw new Error(lab+'нужно минимум два варианта');
      if(!k||!o[+k.value])throw new Error(lab+'отметьте правильный вариант (он должен быть непустым)');
      return {pr,o,k:+k.value,ex}});
    const f=$('#img').files[0],rm=!!$('#rmimg')?.checked;let old=null,imagePath;
    if(id)old=(await sb.from('questions').select('image_path').eq('id',id).single()).data?.image_path;
    if(f){imagePath=`questions/${crypto.randomUUID()}.${EXT[f.type]||'x'}`;await upload(imagePath,f)}else if(rm)imagePath=null;
    const saveOne=async(qid,bk,withImage)=>{
      const row={section:sec,topic_id:+$('#t').value,prompt:bk.pr,is_exam:sec==='macro'&&$('#is_exam').checked,is_published:false};
      if(withImage)row.image_path=imagePath; // у первого вопроса — только если фото менялось
      else row.image_path=imagePath!==undefined?imagePath:(old||null); // у добавленных — то же фото, что у первого
      if(qid){const r=await sb.from('questions').update(row).eq('id',qid);if(r.error)throw r.error}
      else{const r=await sb.from('questions').insert(row).select('id').single();if(r.error)throw r.error;qid=r.data.id}
      await sb.from('question_options').delete().eq('question_id',qid); // ответ-ключ удалится каскадом и создастся заново
      const ins=await sb.from('question_options').insert(bk.o.map((t,i)=>t?{question_id:qid,option_text:t,sort_order:i}:null).filter(Boolean)).select('id,sort_order');
      if(ins.error)throw ins.error;
      const cid=ins.data.find(x=>x.sort_order===bk.k).id;
      const a=await sb.from('question_answers').upsert({question_id:qid,correct_option_id:cid,explanation:bk.ex||null});if(a.error)throw a.error;
      if(pubd){const u=await sb.from('questions').update({is_published:true}).eq('id',qid);if(u.error)throw u.error}
      return qid};
    id=await saveOne(id||null,blocks[0],true); // у первого вопроса фото меняется только при замене/удалении
    for(const bk of blocks.slice(1))await saveOne(null,bk,false);
    if((f||rm)&&old){const used=await sb.from('questions').select('id',{count:'exact',head:true}).eq('image_path',old);if(!used.error&&!used.count)await sb.storage.from('testpatan-media').remove([old])} // общее фото удаляем, только если его больше не использует ни один вопрос
    if(blocks.length>1)toast(`Сохранено вопросов: ${blocks.length}`);
    admin();
  }catch(e){fail($('#e'),e)}
}

async function moveQuestionToTrash(id){
  if(!isAdmin)throw new Error('Доступ только администратору.');
  const q=await sb.from('questions').select('*').eq('id',id).single();if(q.error)throw q.error;
  const o=await sb.from('question_options').select('*').eq('question_id',id).order('sort_order');if(o.error)throw o.error;
  const a=await sb.from('question_answers').select('*').eq('question_id',id).maybeSingle();if(a.error)throw a.error;
  const saved=await sb.from('question_trash').insert({question_id:String(id),question_data:q.data,options_data:o.data||[],answer_data:a.data||null,deleted_by:me?.id||null}).select('id').single();
  if(saved.error)throw new Error('Не удалось сохранить вопрос в корзине. Примените миграцию 0011_question_trash.sql. '+saved.error.message);
  const del=await sb.from('questions').delete().eq('id',id);if(del.error){await sb.from('question_trash').delete().eq('id',saved.data.id);throw del.error}
}
async function adminTrash(mark=true){
  if(mark)markRoute('admintrash');if(!isAdmin)return home();app.innerHTML='<h2>Корзина вопросов</h2><p class="muted">Загрузка…</p>';
  const {data,error}=await sb.from('question_trash').select('*').order('deleted_at',{ascending:false}).limit(500);
  if(error){app.innerHTML=`<h2>Корзина вопросов</h2><div class="err">${esc(error.message)}</div><p class="muted">Примените миграцию 0011_question_trash.sql в Supabase.</p><button class="secondary" onclick="admin()">Назад</button>`;return}
  app.innerHTML=`<h2>Корзина вопросов</h2><p class="muted">Удалённые вопросы хранятся здесь, пока вы не удалите их окончательно.</p><p id="trashTotalCount"><b>В корзине: ${(data||[]).length}</b></p><div class="row"><button class="secondary" onclick="admin()">← Назад к вопросам</button><label style="display:flex;align-items:center;gap:8px;margin:0"><input type="checkbox" id="trashSelectAll" onchange="toggleAllTrash(this.checked)"> Выбрать все (${(data||[]).length})</label><button class="secondary" onclick="purgeSelectedTrash()">Удалить выбранные навсегда (<span id="trashSelectedCount">0</span>)</button></div>${(data||[]).map(r=>`<div class="material-card trash-card" data-trash-id="${r.id}"><label style="display:flex;align-items:flex-start;gap:10px"><input type="checkbox" class="trash-select" value="${r.id}" onchange="updateTrashSelectedCount()" aria-label="Выбрать удалённый вопрос"><span><b>${esc(r.question_data?.prompt||'Вопрос')}</b><small class="muted" style="display:block">${esc(MODES[r.question_data?.section]?.[1]||r.question_data?.section||'')} · Удалён ${r.deleted_at?new Date(r.deleted_at).toLocaleString('ru-RU'):''}</small></span></label><div class="row"><button onclick="restoreQuestionFromTrash('${r.id}')">↩ Восстановить</button><button class="secondary" onclick="purgeQuestionTrash('${r.id}')">Удалить навсегда</button></div></div>`).join('')||'<div class="favorite-empty"><h3>Корзина пуста</h3><p>Удалённые вопросы будут появляться здесь.</p></div>'}`;
}
function updateTrashSelectedCount(){const boxes=[...document.querySelectorAll('.trash-select')],n=boxes.filter(b=>b.checked).length;const count=document.getElementById('trashSelectedCount');if(count)count.textContent=n;const all=document.getElementById('trashSelectAll');if(all){all.checked=boxes.length>0&&n===boxes.length;all.indeterminate=n>0&&n<boxes.length}}
function toggleAllTrash(checked){document.querySelectorAll('.trash-select').forEach(b=>b.checked=checked);updateTrashSelectedCount()}
async function animateTrashRemoval(ids){const idSet=new Set(ids.map(String));const cards=[...document.querySelectorAll('.trash-card')].filter(card=>idSet.has(String(card.dataset.trashId)));cards.forEach(card=>card.classList.add('trash-card-removing'));await new Promise(resolve=>setTimeout(resolve,330));}
async function purgeSelectedTrash(){if(!isAdmin)return home();const ids=[...document.querySelectorAll('.trash-select:checked')].map(b=>b.value);if(!ids.length)return toast('Сначала выберите вопросы.');if(!confirm(`Удалить навсегда ${ids.length} вопросов? Восстановить их будет нельзя.`))return;const button=document.querySelector('button[onclick="purgeSelectedTrash()"]');if(button)button.disabled=true;await animateTrashRemoval(ids);let removed=0;const failures=[];for(const id of ids){const {error}=await sb.from('question_trash').delete().eq('id',id);if(error)failures.push(`${id}: ${error.message}`);else removed++}await adminTrash(false);toast(`Удалено навсегда: ${removed}; ошибок: ${failures.length}`);if(failures.length)alert('Не удалось удалить некоторые записи:\n'+failures.join('\n'))}

async function restoreQuestionFromTrash(trashId){
  if(!isAdmin)return home();
  try{const {data:r,error}=await sb.from('question_trash').select('*').eq('id',trashId).single();if(error)throw error;const q={...r.question_data};
    const exists=await sb.from('questions').select('id').eq('id',q.id).maybeSingle();if(exists.error)throw exists.error;if(exists.data)throw new Error('Вопрос с таким ID уже существует.');
    const qi=await sb.from('questions').insert(q);if(qi.error)throw qi.error;
    if((r.options_data||[]).length){const oi=await sb.from('question_options').insert(r.options_data);if(oi.error){await sb.from('questions').delete().eq('id',q.id);throw oi.error}}
    if(r.answer_data){const ai=await sb.from('question_answers').insert(r.answer_data);if(ai.error){await sb.from('questions').delete().eq('id',q.id);throw ai.error}}
    const del=await sb.from('question_trash').delete().eq('id',trashId);if(del.error)throw del.error;toast('Вопрос восстановлен');adminTrash(false);
  }catch(e){toast('Не удалось восстановить вопрос: '+(e?.message||e))}
}
async function purgeQuestionTrash(id){if(!isAdmin)return home();if(!confirm('Удалить вопрос из корзины навсегда? Восстановить его будет нельзя.'))return;await animateTrashRemoval([id]);const {error}=await sb.from('question_trash').delete().eq('id',id);if(error){await adminTrash(false);return toast('Не удалось удалить: '+error.message)}toast('Вопрос удалён навсегда');await adminTrash(false)}
init();

/* ===== Liquid glass tab bar: линза скользит за активной вкладкой и «подхватывается» пальцем ===== */
const SIDE_TABS=['home','sections','profile','favorites','materials'];
function syncSide(route){const r=String(route||'').split('/')[0];if(r==='quiz')return;
  const map={home:'home',sections:'sections',mode:'sections',topic:'sections',tests:'sections',profile:'profile',favorites:'favorites',favorite:'favorites',materials:'materials'};
  const k=map[r]||'';document.querySelectorAll('#sidebar .side-link').forEach(x=>x.classList.toggle('active',!!k&&x.dataset.side===k))}
(function initGlassTabs(){
  const bar=document.getElementById('sidebar');if(!bar)return;
  const tabs=[...bar.querySelectorAll('.side-link')];tabs.forEach((t,i)=>{if(SIDE_TABS[i])t.dataset.side=SIDE_TABS[i]});
  const lens=document.createElement('div');lens.className='side-lens';bar.prepend(lens);
  const mobile=()=>matchMedia('(max-width:700px)').matches;
  const place=(el,instant)=>{if(!el||!mobile())return;const b=bar.getBoundingClientRect(),r=el.getBoundingClientRect();
    const x=r.left-b.left+3,w=r.width-6;if(instant){lens.style.transition='none'}
    const moved=lens.style.getPropertyValue('--x')!==x+'px';
    lens.style.setProperty('--w',w+'px');lens.style.setProperty('--x',x+'px');
    if(instant){void lens.offsetWidth;lens.style.transition=''}
    else if(moved&&!drag){lens.classList.add('go');clearTimeout(place.t);place.t=setTimeout(()=>lens.classList.remove('go'),200)}};
  const active=()=>tabs.find(t=>t.classList.contains('active'));
  let drag=false,pid=null,startX=0,moved=false,downTab=null;
  const nearest=x=>{let best=null,bd=1e9;tabs.forEach(t=>{const r=t.getBoundingClientRect(),d=Math.abs(x-(r.left+r.width/2));if(d<bd){bd=d;best=t}});return best};
  let moveFrame=0,latestX=0,targetX=0,currentX=0;
  const follow=x=>{latestX=x;const b=bar.getBoundingClientRect(),w=parseFloat(lens.style.getPropertyValue('--w'))||60;targetX=Math.max(3,Math.min(b.width-w-3,latestX-b.left-w/2));if(!moveFrame)moveFrame=requestAnimationFrame(smoothFollow)};
  const smoothFollow=()=>{moveFrame=0;if(!drag)return;const raw=parseFloat(lens.style.getPropertyValue('--x'));currentX=Number.isFinite(raw)?raw:targetX;const delta=targetX-currentX;currentX+=delta*.24;if(Math.abs(delta)<.35)currentX=targetX;lens.style.setProperty('--x',currentX+'px');if(Math.abs(targetX-currentX)>.35)moveFrame=requestAnimationFrame(smoothFollow)};
  bar.addEventListener('pointerdown',e=>{if(!mobile()||(e.pointerType==='mouse'&&e.button!==0))return;drag=true;moved=false;pid=e.pointerId;startX=e.clientX;downTab=nearest(e.clientX);lens.classList.add('press','drag');/* Не телепортируем линзу на pointerdown: при обычном касании она должна плавно доехать до вкладки на pointerup. */try{bar.setPointerCapture(pid)}catch(_){}});
  bar.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==pid)return;if(Math.abs(e.clientX-startX)>6)moved=true;if(moved)follow(e.clientX)});
  const end=(e,cancel)=>{if(!drag||e.pointerId!==pid)return;drag=false;if(moveFrame){cancelAnimationFrame(moveFrame);moveFrame=0}lens.classList.remove('press','drag');try{bar.releasePointerCapture(pid)}catch(_){}
    const t=cancel?active():nearest(e.clientX);place(t||active());if(!cancel&&t){const was=active();if(t!==was||!moved)setTimeout(()=>t.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})),90)}};
  bar.addEventListener('pointerup',e=>end(e,false));bar.addEventListener('pointercancel',e=>end(e,true));
  // родные клики мыши/пальца гасим — вместо них сработает наш (после анимации); клавиатура (detail=0) работает как обычно
  bar.addEventListener('click',e=>{if(mobile()&&e.detail>0&&e.isTrusted){e.stopPropagation();e.preventDefault()}},true);
  new MutationObserver(()=>{if(!drag)place(active())}).observe(bar,{attributes:true,subtree:true,attributeFilter:['class']});
  addEventListener('resize',()=>place(active(),true));addEventListener('orientationchange',()=>setTimeout(()=>place(active(),true),200));
  place(active(),true);setTimeout(()=>place(active(),true),300);if(document.fonts?.ready)document.fonts.ready.then(()=>place(active(),true));
})();

/* ===== Уведомления: колокольчик в шапке + рассылка из админки ===== */
let notifs=[],freshNow=new Set();
const seenKey='tp_seen_notifs';
const getSeen=()=>{try{return new Set(JSON.parse(localStorage.getItem(seenKey)||'[]'))}catch(e){return new Set()}};
const setSeen=set=>{try{localStorage.setItem(seenKey,JSON.stringify([...set].slice(-300)))}catch(e){}};
const notifDate=d=>new Date(d).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
function updateBell(prevUnread){const seen=getSeen(),n=notifs.filter(x=>!seen.has(x.id)).length,b=$('#bellBadge'),btn=$('#bellBtn');if(!b)return;b.hidden=!n;b.textContent=n>9?'9+':String(n);
  if(n&&prevUnread!==undefined&&n>prevUnread&&btn){btn.classList.remove('ring');void btn.offsetWidth;btn.classList.add('ring')}return n}
async function loadNotifs(){try{const prev=updateBell();const {data,error}=await sb.from('notifications').select('id,title,body,created_at').order('created_at',{ascending:false}).limit(30);if(error)throw error;notifs=data||[];updateBell(prev);if(!$('#notifPanel')?.hidden)renderNotifs(freshNow)}catch(e){notifs=[];updateBell()}}
function renderNotifs(fresh){const p=$('#notifPanel');if(!p)return;
  p.innerHTML=`<div class="notif-head"><b>Уведомления</b></div>`+(notifs.length?`<div class="notif-list">${notifs.map(n=>`<div class="notif-item ${fresh.has(n.id)?'new':''}"><div class="notif-title">${esc(n.title)}${fresh.has(n.id)?'<i>новое</i>':''}</div>${n.body?`<div class="notif-body">${esc(n.body).replace(/\n/g,'<br>')}</div>`:''}<time>${notifDate(n.created_at)}</time></div>`).join('')}</div>`:'<div class="notif-empty"><div>🔔</div>Пока нет уведомлений</div>')}
function toggleNotifs(e){if(e)e.stopPropagation();const p=$('#notifPanel');if(!p)return;if(!p.hidden){p.hidden=true;freshNow=new Set();return}
  const seen=getSeen(),fresh=new Set(notifs.filter(x=>!seen.has(x.id)).map(x=>x.id));freshNow=fresh;renderNotifs(fresh);p.hidden=false;
  notifs.forEach(x=>seen.add(x.id));setSeen(seen);updateBell();loadNotifs()}
document.addEventListener('click',e=>{const p=$('#notifPanel');if(p&&!p.hidden&&!e.target.closest('.notif-wrap'))p.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const p=$('#notifPanel');if(p)p.hidden=true}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadNotifs()});
setInterval(()=>{if(!document.hidden)loadNotifs()},90000);
async function adminNotifications(mark=true){if(mark)markRoute('adminnotify');if(!isAdmin)return home();
  const {data,error}=await sb.from('notifications').select('id,title,body,created_at').order('created_at',{ascending:false}).limit(50);
  if(error){app.innerHTML=`<h2>Уведомления</h2><div class="err">${esc(msg(error))}</div><p class="muted">Примените миграцию 0009_notifications.sql в Supabase.</p><button class="secondary" onclick="admin()">Назад</button>`;return}
  const rows=data||[];
  app.innerHTML=`<h2>Рассылка уведомлений</h2><div class="panel"><p class="muted">Уведомление увидят все посетители сайта: оно появится в колокольчике рядом с личным кабинетом.</p><div id="nerr"></div>
<label>Заголовок</label><input id="ntitle" maxlength="120" placeholder="Например: Добавлены новые вопросы по теме «Некроз»" oninput="$('#ncnt').textContent=this.value.length+' / 120'"><div class="muted" id="ncnt" style="text-align:right;font-size:12px">0 / 120</div>
<label>Текст (необязательно)</label><textarea id="nbody" maxlength="2000" placeholder="Подробности для студентов"></textarea>
<div class="row"><button onclick="sendNotification()">🔔 Отправить всем</button><button class="secondary" onclick="admin()">Назад</button></div></div>
<h3>Отправленные</h3>${rows.map(n=>`<div class="material-card"><b>${esc(n.title)}</b> <span class="muted">${notifDate(n.created_at)}</span>${n.body?`<div class="material-body">${esc(n.body)}</div>`:''}<div class="row"><button class="secondary" onclick="deleteNotification('${n.id}')">Удалить</button></div></div>`).join('')||'<p class="muted">Пока ничего не отправлено.</p>'}`}
async function sendNotification(){try{const title=$('#ntitle').value.trim(),body=$('#nbody').value.trim();if(!title)throw new Error('Введите заголовок');
  const {error}=await sb.from('notifications').insert({title,body:body||null});if(error)throw error;toast('Уведомление отправлено всем');await loadNotifs();adminNotifications(false)}catch(e){fail($('#nerr'),e)}}
async function deleteNotification(id){if(!confirm('Удалить уведомление? Оно пропадёт у всех.'))return;const {error}=await sb.from('notifications').delete().eq('id',id);if(error)return toast(msg(error));await loadNotifs();adminNotifications(false)}

document.addEventListener('click',e=>{if(!e.target.closest('.top-search'))searchClose()});
loadNotifs();
</script></body></html>
