async function restoreRoute(r){if(!r||r==='home')return home(false);const a=r.split('/');if(a[0]==='login')return authPage();if(a[0]==='mode'&&a[1])return pick(a[1],false);if(a[0]==='topic'&&a[1]&&a[2])return pickTopic(a[1],a[2],false);if(a[0]==='profile'&&me)return profile(false);if(a[0]==='favorites')return favoritesPage(false);if(a[0]==='favorite'&&a[1])return openFavorite(a[1],false);if(a[0]==='tests')return testsPage(false);if(a[0]==='materials')return materialsPage(false);if(a[0]==='admincontent'&&isAdmin)return adminContent(false);if(a[0]==='adminmaterials'&&isAdmin)return adminMaterials(false);if(a[0]==='admin'&&isAdmin)return admin(false);if(a[0]==='stats'&&isAdmin)return adminStats(a[1]||'');if(a[0]==='edit'&&isAdmin)return editQ(a[1]||undefined,false);if(a[0]==='quiz'&&Q)return showQ();return home(false)}

async function start(mode,topic){markRoute('quiz');
  app.innerHTML='<p>Загрузка…</p>';
  const {data,error}=await sb.rpc('start_attempt',{p_mode:mode,p_topic_id:topic,p_count:10});
  if(error){fail(app,error);app.innerHTML+='<button class="secondary" onclick="home()">На главную</button>';return}
  Q={id:data.attempt_id,qs:data.questions,i:0,mode,t0:Date.now()}; showQ();
}
function showQ(){
  const q=Q.qs[Q.i],pc=Math.round((Q.i+1)/Q.qs.length*100),hasImage=!!q.image_path;
  if(!Q.order)Q.order={};
  if(!Q.order[q.id])Q.order[q.id]=[...(q.options||[])].sort(()=>Math.random()-.5);
  if(!Q.answers)Q.answers={};
  const nav=Q.qs.map((x,i)=>`<button class="${i===Q.i?'current ':''}${Q.answers[x.id]?'done ':'skipped'}" onclick="goQ(${i})" aria-label="Вопрос ${i+1}">${i+1}</button>`).join('');
  const visual=hasImage?`<div class="zoom-wrap"><img class="photo" src="${esc(pub(q.image_path))}" alt="Препарат" onclick="zoomImage(this.src)"><button class="zoom-btn" onclick="zoomImage('${esc(pub(q.image_path))}')" title="Увеличить изображение" aria-label="Увеличить изображение">⌕</button></div>`:'';
  app.innerHTML=`<div class="panel"><div class="q-head-tools"><div class="muted">${esc(MODES[Q.mode]?.[1]||Q.mode)} · Вопрос ${Q.i+1} из ${Q.qs.length}</div><button class="favorite-btn ${Q.favorites?.[q.id]?'on':''}" onclick="toggleFavorite('${q.id}')">${Q.favorites?.[q.id] ? '★ В избранном' : '☆ В избранное'}</button></div><div class="progress"><span style="width:${pc}%"></span></div><div class="question-nav" aria-label="Выбор номера задания">${nav}</div><div class="quiz-layout ${hasImage?'':'no-image'}"><div class="quiz-visual ${hasImage?'':'empty'}">${visual}</div><div class="quiz-content"><h3>${esc(q.prompt)}</h3><div class="answers" id="ans">`+Q.order[q.id].map(o=>`<button class="answer" data-id="${o.id}">${esc(o.text)}</button>`).join('')+`</div><div id="fb"></div><div class="row"><button class="secondary" onclick="skipQ()">${Q.i===Q.qs.length-1?'К результатам':'Пропустить'}</button><button onclick="nextQ()">${Q.i===Q.qs.length-1?'Завершить тест':'Следующий вопрос →'}</button></div></div></div></div>`;
  const prior=Q.answers[q.id];
  document.querySelectorAll('#ans button').forEach(b=>{b.onclick=()=>answer(b,q);if(prior){b.disabled=true;if(b.dataset.id===prior.chosen)b.classList.add(prior.correct?'correct':'wrong');if(prior.correctId&&b.dataset.id===prior.correctId)b.classList.add('correct')}});
  if(prior&&Q.mode!=='exam')$('#fb').innerHTML=prior.explanation?`<div class="feedback">${esc(prior.explanation)}</div>`:'';
}
function goQ(i){if(i<0||i>=Q.qs.length)return;Q.i=i;showQ()}
function skipQ(){if(Q.i<Q.qs.length-1){Q.i++;showQ()}else finish()}
function zoomImage(src){
  const el=document.createElement('div');el.className='zoom-overlay';
  el.innerHTML=`<div class="zoom-toolbar"><span>Колесо мыши — масштаб · Перетаскивание — перемещение · Esc — закрыть</span><button type="button" class="zoom-close" aria-label="Закрыть">×</button></div><img src="${esc(src)}" alt="Увеличенное изображение" draggable="false">`;
  const img=el.querySelector('img');let scale=1,tx=0,ty=0,drag=false,sx=0,sy=0,ox=0,oy=0;
  const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;img.style.cursor=scale>1?'grab':'zoom-in'};
  const close=()=>{el.remove();document.removeEventListener('keydown',keyClose)};
  const keyClose=e=>{if(e.key==='Escape')close()};
  el.querySelector('.zoom-close').onclick=close;el.addEventListener('click',e=>{if(e.target===el)close()});
  el.addEventListener('wheel',e=>{e.preventDefault();const rect=img.getBoundingClientRect(),cx=e.clientX-(rect.left+rect.width/2),cy=e.clientY-(rect.top+rect.height/2),old=scale;scale=Math.max(1,Math.min(8,scale*(e.deltaY<0?1.2:1/1.2)));const ratio=scale/old;tx=(tx-cx)*ratio+cx;ty=(ty-cy)*ratio+cy;if(scale===1){tx=0;ty=0}apply()},{passive:false});
  img.addEventListener('pointerdown',e=>{if(scale<=1)return;drag=true;img.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;img.style.cursor='grabbing'});img.addEventListener('pointermove',e=>{if(!drag)return;tx=ox+e.clientX-sx;ty=oy+e.clientY-sy;apply()});img.addEventListener('pointerup',()=>{drag=false;apply()});img.addEventListener('dblclick',e=>{e.preventDefault();scale=scale===1?2.5:1;tx=ty=0;apply()});
  document.addEventListener('keydown',keyClose);document.body.appendChild(el);apply();
}

async function answer(btn,q){
  const bs=[...document.querySelectorAll('#ans button')];bs.forEach(b=>b.disabled=true);
  const {data,error}=await sb.rpc('check_answer',{p_attempt:Q.id,p_question:q.id,p_option:btn.dataset.id});
  if(error){fail($('#fb'),error);bs.forEach(b=>b.disabled=false);return}
  const prior={chosen:btn.dataset.id,correct:Q.mode==='exam'?null:!!data.is_correct,correctId:Q.mode==='exam'?null:data.correct_option_id,explanation:Q.mode==='exam'?'':(data.explanation||'')};
  Q.answers=q.id?Q.answers||{}:{};Q.answers[q.id]=prior;
  if(Q.mode==='exam'){btn.classList.add('sel');$('#fb').innerHTML='<div class="feedback">Ответ сохранён.</div>';return}
  bs.forEach(b=>{if(b.dataset.id===data.correct_option_id)b.classList.add('correct')});
  if(!data.is_correct)btn.classList.add('wrong');
  $('#fb').innerHTML=(data.explanation?`<div class="feedback">${esc(data.explanation)}</div>`:'');
  document.querySelectorAll('.question-nav button')[Q.i]?.classList.add('done');
}

function nextQ(){Q.i++;Q.i<Q.qs.length?showQ():finish()}
async function finish(){
  const {data,error}=await sb.rpc('finish_attempt',{p_attempt:Q.id});
  if(error){fail(app,error);return}

const mail=u=>u+'@'+CFG.emailDomain;
async function login(){
  const u=$('#u').value.trim().toLowerCase();
  const {error}=await sb.auth.signInWithPassword({email:mail(u),password:$('#p').value});
  if(error)return fail($('#e'),/invalid/i.test(error.message)?'Неверный логин или пароль':error);

async function register(){
  const u=$('#u').value.trim().toLowerCase(),n=$('#n').value.trim(),p=$('#p').value;

  if(p.length<8)return fail($('#e'),'Пароль: минимум 8 символов');
  const {data,error}=await sb.auth.signUp({email:mail(u),password:p,options:{data:{username:u,nickname:n}}});
  if(error)return fail($('#e'),/database error|already/i.test(error.message)?'Этот логин занят или недопустим':error);
  if(!data.session)return fail($('#e'),'Аккаунт создан, но вход не выполнен: в Supabase отключите подтверждение email (см. README).');

const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
async function upload(path,f){
  if(!EXT[f.type])throw new Error('Допустимы только JPEG, PNG и WebP');
  if(f.size>5*1024*1024)throw new Error('Файл больше 5 МБ');
  const {error}=await sb.storage.from('testpatan-media').upload(path,f,{upsert:true,contentType:f.type});
  if(error)throw error;
}

function loadMaterialById(id){const m=materialsAdminCache.find(x=>x.id===id);if(m)loadMaterial(m)}
function loadMaterial(m){$('#mid').value=m.id;$('#mk').value=m.kind||'Другое';$('#mt').value=m.title||'';$('#mb').value=m.body||'';$('#mu').value=m.url||'';$('#mo').value=m.sort_order||0;$('#mp').checked=!!m.is_published;window.scrollTo({top:0,behavior:'smooth'})}
async function saveMaterial(){try{const id=$('#mid').value,row={kind:$('#mk').value,title:$('#mt').value.trim(),body:$('#mb').value.trim(),url:$('#mu').value.trim()||null,sort_order:Number($('#mo').value||0),is_published:$('#mp').checked};if(!row.title)throw new Error('Введите название');if(row.url&&!/^https?:\/\//i.test(row.url))throw new Error('Ссылка должна начинаться с http:// или https://');const r=id?await sb.from('learning_materials').update(row).eq('id',id):await sb.from('learning_materials').insert(row);if(r.error)throw r.error;adminMaterials()}catch(e){fail($('#materr'),e)}}
async function deleteMaterial(id){if(!confirm('Удалить материал?'))return;const {error}=await sb.from('learning_materials').delete().eq('id',id);if(error)return toast(msg(error));adminMaterials()}
async function adminContent(mark=true){if(mark)markRoute('admincontent');if(!isAdmin)return home();const {data,error}=await sb.from('site_content').select('*');if(error){app.innerHTML=`<h2>Оформление главной</h2><div class="err">${esc(msg(error))}</div><p>Примените миграцию 0006_favorites_materials_home_content.sql в Supabase.</p><button class="secondary" onclick="admin()">Назад</button>`;return}const c=Object.fromEntries((data||[]).map(x=>[x.key,x.value]));app.innerHTML=`<h2>Оформление главной страницы</h2><p class="muted">Здесь можно менять изображение шапки и обе цитаты. Для изображений используйте прямую ссылку https://…</p><div class="panel"><div id="contenterr"></div><label>Изображение шапки (можно загрузить файл)</label><input id="heroimg" value="${esc(c.hero_image||'')}" placeholder="URL изображения https://..."><input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp"><label>Цитата слева</label><textarea id="leftquote">${esc(c.left_quote||'«Патологическая анатомия — это язык, на котором организм говорит с врачом.»')}</textarea><label>Изображение рядом с правой цитатой</label><input id="rightimg" value="${esc(c.right_quote_image||'')}" placeholder="URL изображения https://..."><input id="rightFile" type="file" accept="image/jpeg,image/png,image/webp"><label>Правая цитата</label><textarea id="rightquote">${esc(c.right_quote||'«Морфология всего живого — это история болезни и здоровья.»')}</textarea><div class="row"><button onclick="saveHomeContent()">Сохранить оформление</button><button class="secondary" onclick="admin()">Назад</button></div></div>`}
async function saveHomeContent(){try{const uploadHomeImage=async(input,key)=>{const f=$(input).files[0];if(!f)return null;if(!EXT[f.type])throw new Error('Допустимы JPEG, PNG и WebP');if(f.size>5*1024*1024)throw new Error('Файл больше 5 МБ');const path=`site-content/${key}-${crypto.randomUUID()}.${EXT[f.type]}`;const {error}=await sb.storage.from('testpatan-media').upload(path,f,{upsert:true,contentType:f.type});if(error)throw error;return sb.storage.from('testpatan-media').getPublicUrl(path).data.publicUrl};const heroUploaded=await uploadHomeImage('#heroFile','hero'),rightUploaded=await uploadHomeImage('#rightFile','right-quote');const rows=[['hero_image',heroUploaded||$('#heroimg').value.trim()],['left_quote',$('#leftquote').value.trim()],['right_quote_image',rightUploaded||$('#rightimg').value.trim()],['right_quote',$('#rightquote').value.trim()]];for(const [key,value] of rows){const {error}=await sb.from('site_content').upsert({key,value},{onConflict:'key'});if(error)throw error}toast('Оформление сохранено');home()}catch(e){fail($('#contenterr'),e)}}

async function editQ(id,mark=true){if(mark)markRoute('edit'+(id?'/'+id:''));
  let q={section:'macro',topic_id:topics[0]?.id,prompt:'',is_exam:false,is_published:false,image_path:null},opts=[],key=null,expl='';
  if(id){
    q=(await sb.from('questions').select('*').eq('id',id).single()).data;
    opts=(await sb.from('question_options').select('*').eq('question_id',id).order('sort_order')).data||[];
    const k=(await sb.from('question_answers').select('*').eq('question_id',id).maybeSingle()).data;key=k?.correct_option_id;expl=k?.explanation||'';
  }
  while(opts.length<4)opts.push({id:'',option_text:''});
  app.innerHTML=`<div class="panel"><h2>${id?'Редактирование':'Новый вопрос'}</h2><div id="e"></div>
<label>Режим</label><select id="s">${['macro','micro','theory'].map(s=>`<option value="${s}" ${s===q.section?'selected':''}>${MODES[s][1]}</option>`).join('')}</select>
<label>Тема</label><select id="t">${[...topics].sort((a,b)=>({general:0,specific:1}[a.block]-{general:0,specific:1}[b.block])||a.sort_order-b.sort_order||a.title.localeCompare(b.title,'ru')).map(t=>`<option value="${t.id}" ${t.id===q.topic_id?'selected':''}>${BLOCKS[t.block]}: ${esc(t.title)}</option>`).join('')}</select>
<label>Текст вопроса</label><textarea id="pr">${esc(q.prompt)}</textarea>
<label>Фото (JPEG/PNG/WebP до 5 МБ)</label>${q.image_path?`<img class="photo" style="max-height:160px" src="${esc(pub(q.image_path))}"><label><input type="checkbox" id="rmimg"> Удалить фото</label>`:''}<input id="img" type="file" accept="image/jpeg,image/png,image/webp">
<label>Варианты ответа (отметьте правильный; пустые игнорируются)</label>`+opts.map((o,i)=>`<div class="row" style="align-items:center"><input type="radio" name="k" value="${i}" ${o.id&&o.id===key?'checked':''} style="flex:0 0 24px;min-width:24px"><input class="op" value="${esc(o.option_text)}"></div>`).join('')+`
<label>Пояснение (показывается после ответа)</label><textarea id="ex">${esc(expl)}</textarea>
<label><input type="checkbox" id="is_exam" ${q.is_exam?'checked':''}> Включить в экзамен (только режим «Макро»)</label>
<label><input type="checkbox" id="pb" ${q.is_published?'checked':''}> Опубликовать</label>
<div class="row"><button onclick="saveQ('${id||''}')">Сохранить</button><button class="secondary" onclick="admin()">Отмена</button>${id?`<button class="danger" onclick="delQ('${id}')">Удалить</button>`:''}</div></div>`;
}
async function saveQ(id){
  try{
    const o=[...document.querySelectorAll('.op')].map(i=>i.value.trim()),k=document.querySelector('input[name=k]:checked');
    const sec=$('#s').value,pr=$('#pr').value.trim(),pubd=$('#pb').checked;
    if(!pr)throw new Error('Введите текст вопроса');
    if(o.filter(Boolean).length<2)throw new Error('Нужно минимум два варианта');
    if(!k||!o[+k.value])throw new Error('Отметьте правильный вариант (он должен быть непустым)');
    const row={section:sec,topic_id:+$('#t').value,prompt:pr,is_exam:sec==='macro'&&$('#is_exam').checked,is_published:false};
    const f=$('#img').files[0];let old=null;
    if(id)old=(await sb.from('questions').select('image_path').eq('id',id).single()).data?.image_path;
    if(f){row.image_path=`questions/${crypto.randomUUID()}.${EXT[f.type]||'x'}`;await upload(row.image_path,f)}
    else if($('#rmimg')?.checked)row.image_path=null;
    if(id){const r=await sb.from('questions').update(row).eq('id',id);if(r.error)throw r.error}
    else{const r=await sb.from('questions').insert(row).select('id').single();if(r.error)throw r.error;id=r.data.id}
    if((f||$('#rmimg')?.checked)&&old)await sb.storage.from('testpatan-media').remove([old]);
    await sb.from('question_options').delete().eq('question_id',id); // ответ-ключ удалится каскадом и создастся заново
    const ins=await sb.from('question_options').insert(o.map((t,i)=>t?{question_id:id,option_text:t,sort_order:i,_i:i}:null).filter(Boolean).map(({_i,...r})=>r)).select('id,sort_order');
    if(ins.error)throw ins.error;
    const cid=ins.data.find(x=>x.sort_order===+k.value).id;
    const a=await sb.from('question_answers').upsert({question_id:id,correct_option_id:cid,explanation:$('#ex').value.trim()||null});if(a.error)throw a.error;
    if(pubd){const u=await sb.from('questions').update({is_published:true}).eq('id',id);if(u.error)throw u.error}
    admin();
  }catch(e){fail($('#e'),e)}
}
async function delQ(id){
  if(!confirm('Удалить вопрос безвозвратно?'))return;
  const {error}=await sb.from('questions').delete().eq('id',id);
  error?fail($('#e'),error):admin();
}
init();
</script></body></html>
